<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEdui</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/ledui.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="lang-switch" role="group" data-i18n-aria-label="lang.label">
                <button type="button" data-lang="es" aria-pressed="true" title="Español">ES</button>
                <button type="button" data-lang="en" aria-pressed="false" title="English">EN</button>
            </div>
            <div class="header-content">
                <div class="logo">
                    <img src="/static/logo-ledu2.png" alt="LEdui" style="width: 130px; height: 130px;">
                </div>
                <h1 data-i18n="app.title">Lectura Educativa Inclusiva - LEdui</h1>
                <p class="subtitle" data-i18n="app.subtitle"></p>
            </div>
        </header>

        <main class="content">
            <!-- Autenticación -->
            <section id="authSection" class="auth-section">
                <h2 data-i18n="auth.title"></h2>
                <p id="authSubtitle" style="text-align: center;" data-i18n="auth.subtitle"></p>

                <div id="accessKeyGroup" class="access-key-group" hidden>
                    <label for="accessKey">
                        <span data-i18n="auth.key_label"></span>
                        <span class="required-indicator">*</span>
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="accessKey" class="access-key-input"
                               data-i18n-placeholder="auth.key_placeholder" autocomplete="off">
                        <button type="button" id="togglePassword" class="toggle-password"
                                data-i18n-aria-label="auth.toggle_key">👁️</button>
                    </div>
                    <div id="keyHint" class="key-hint neutral" data-i18n="auth.key_hint" aria-live="polite"></div>
                </div>

                <div class="google-signin-divider" data-i18n="auth.google_divider"></div>
                <div id="googleSigninWrapper" class="google-signin-wrapper disabled">
                    <div id="googleButton" style="display: flex; justify-content: center;"></div>
                </div>
                <div id="authError" class="error" role="alert"></div>
            </section>

            <!-- Usuario autenticado -->
            <section id="userInfo" class="user-info">
                <img id="userAvatar" src="" alt="" class="user-avatar" referrerpolicy="no-referrer">
                <div class="user-details">
                    <div class="user-name" id="userName"></div>
                    <div class="user-email" id="userEmail"></div>
                    <div class="user-stats">
                        <div class="stat">
                            <span class="stat-label" data-i18n="user.transformations"></span>
                            <span class="stat-value" id="statTotal">0</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label" data-i18n="user.tokens"></span>
                            <span class="stat-value" id="statTokens">0</span>
                        </div>
                    </div>
                </div>
                <button type="button" id="btnLogout" class="btn-logout" data-i18n="user.logout"></button>
            </section>

            <!-- Pestañas -->
            <div id="tabsContainer" class="tabs-container">
                <nav class="tabs-nav" role="tablist">
                    <button type="button" class="tab-button active" role="tab" data-tab="adaptar" data-i18n="tabs.adapt"></button>
                    <button type="button" class="tab-button" role="tab" data-tab="historial" data-i18n="tabs.history"></button>
                    <button type="button" class="tab-button" role="tab" data-tab="admin" data-i18n="tabs.admin" hidden></button>
                </nav>

                <!-- Pestaña: adaptar -->
                <div id="tabAdaptar" class="tab-content active" role="tabpanel">
                    <div class="action-section active">
                        <div class="form-group">
                            <label for="enunciado" data-i18n="form.statement"></label>
                            <textarea id="enunciado" maxlength="15000" data-i18n-placeholder="form.statement_placeholder"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="nivel" data-i18n="form.level"></label>
                            <select id="nivel">
                                <option value="primaria" data-i18n="levels.primaria"></option>
                                <option value="secundaria" data-i18n="levels.secundaria" selected></option>
                                <option value="bachillerato" data-i18n="levels.bachillerato"></option>
                                <option value="fp" data-i18n="levels.fp"></option>
                                <option value="universidad" data-i18n="levels.universidad"></option>
                            </select>
                            <p class="lang-note" data-i18n="form.output_language"></p>
                        </div>

                        <button type="button" id="btnAdaptar" class="btn-primary" data-i18n="form.submit"></button>

                        <div id="loading" class="loading" aria-live="polite">
                            <div class="spinner"></div>
                            <div class="loading-text" data-i18n="loading.processing"></div>
                            <div id="loadingStep" class="loading-step"></div>
                        </div>

                        <div id="error" class="error" role="alert"></div>

                        <div id="result" class="result">
                            <div class="result-section">
                                <h3 data-i18n="result.statement"></h3>
                                <div id="resultStatement" class="result-content"></div>
                            </div>
                            <div class="result-section">
                                <h3 data-i18n="result.teacher"></h3>
                                <div id="resultIndicaciones" class="result-content"></div>
                            </div>
                            <div class="result-section">
                                <h3 data-i18n="result.pictograms"></h3>
                                <img id="pictogramImage" class="pictogram-image" alt="" hidden>
                                <h4 data-i18n="result.where_skill"></h4>
                                <div id="habilidadesList" class="habilidades-list"></div>
                            </div>
                            <div class="result-section">
                                <h3 data-i18n="result.context"></h3>
                                <div id="contextImages" class="context-images"></div>
                            </div>
                            <div id="resultTokens" class="result-tokens"></div>
                        </div>
                    </div>
                </div>

                <!-- Pestaña: historial -->
                <div id="tabHistorial" class="tab-content" role="tabpanel">
                    <div class="historial-header">
                        <h2 data-i18n="history.title"></h2>
                        <p data-i18n="history.subtitle"></p>
                    </div>
                    <div class="historial-card">
                        <div class="historial-controls">
                            <button type="button" id="btnReloadHistorial" class="btn-secondary" data-i18n="history.reload"></button>
                            <div class="historial-stats" id="historialStats"></div>
                        </div>
                        <div class="historial-table-container">
                            <table class="historial-table">
                                <thead>
                                    <tr>
                                        <th data-i18n="table.id"></th>
                                        <th data-i18n="table.statement"></th>
                                        <th data-i18n="table.level"></th>
                                        <th data-i18n="table.language"></th>
                                        <th data-i18n="table.date"></th>
                                        <th data-i18n="table.status"></th>
                                        <th data-i18n="table.actions"></th>
                                    </tr>
                                </thead>
                                <tbody id="historialTableBody"></tbody>
                            </table>
                        </div>
                        <div id="historialEmpty" class="empty-state" hidden>
                            <div class="empty-state-icon">📭</div>
                            <h3 data-i18n="history.empty_title"></h3>
                            <p data-i18n="history.empty_text"></p>
                        </div>
                    </div>
                </div>

                <!-- Pestaña: administración (solo usuarios con is_admin) -->
                <div id="tabAdmin" class="tab-content" role="tabpanel">
                    <div class="admin-section active">
                        <div class="admin-header">
                            <h2 data-i18n="admin.title"></h2>
                            <p data-i18n="admin.subtitle"></p>
                        </div>
                        <div class="admin-card">
                            <h3 data-i18n="admin.users"></h3>
                            <div class="table-controls">
                                <button type="button" id="btnReloadUsers" class="btn-secondary" data-i18n="history.reload"></button>
                            </div>
                            <div class="table-container">
                                <table class="admin-table">
                                    <thead>
                                        <tr>
                                            <th data-i18n="table.id"></th>
                                            <th data-i18n="table.email"></th>
                                            <th data-i18n="table.name"></th>
                                            <th data-i18n="table.role"></th>
                                            <th data-i18n="table.registered"></th>
                                            <th data-i18n="table.transformations"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="usuariosTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                        <div class="admin-card">
                            <h3 data-i18n="admin.transformations"></h3>
                            <div class="table-controls">
                                <button type="button" id="btnReloadTrans" class="btn-secondary" data-i18n="history.reload"></button>
                            </div>
                            <div class="table-container">
                                <table class="admin-table">
                                    <thead>
                                        <tr>
                                            <th data-i18n="table.id"></th>
                                            <th data-i18n="table.user"></th>
                                            <th data-i18n="table.level"></th>
                                            <th data-i18n="table.language"></th>
                                            <th data-i18n="table.duration"></th>
                                            <th data-i18n="table.status"></th>
                                            <th data-i18n="table.actions"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="transformacionesTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de detalle -->
    <div id="transformacionModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle" data-i18n="detail.title"></h3>
                <button type="button" id="btnCloseModal" class="btn-close" data-i18n-aria-label="common.close">✕</button>
            </div>
            <div id="transformacionDetail" class="modal-body"></div>
        </div>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="LEdui.onGoogleLoaded()"></script>
</body>
</html>
